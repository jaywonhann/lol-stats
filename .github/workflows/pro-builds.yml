# 프로 선수·챌린저 상위 랭커가 최근 솔로랭크에서 간 빌드를 모아 pro-data 브랜치(builds.json)에 올립니다.
# 윈도우 앱과 사이트의 /app 화면이 이 파일을 읽어요.
name: 프로 빌드 수집

on:
  schedule:
    - cron: "40 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pro-builds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts
            data/pros.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 빌드 모으기
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          OUT: /tmp/pro-data
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p $OUT
          git fetch --depth=1 origin pro-data 2>/dev/null && git show origin/pro-data:builds.json > $OUT/builds.json 2>/dev/null || rm -f $OUT/builds.json
          node scripts/pro-builds.mjs
          cd $OUT && [ -f builds.json ] || exit 0
          git init -q -b pro-data \
            && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add builds.json \
            && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "프로 빌드" \
            && git push -q --force "https://x-access-token:$TOKEN@github.com/$REPO.git" pro-data
