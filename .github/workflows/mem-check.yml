name: 메모리 점검
# Render 무료 서버(512MB)에서처럼 사이트를 띄우고, 페이지마다 응답과 서버 메모리(RSS)를 잽니다. 시크릿 없음.
on:
  workflow_dispatch:
    inputs:
      node:
        description: Node 버전
        default: "20.18.1"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node || '20.18.1' }}
      - run: npm ci && npm run build
      - name: Start and measure
        run: |
          NODE_OPTIONS=--max-old-space-size=256 PORT=3999 node node_modules/next/dist/bin/next start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3999/robots.txt && break; sleep 1; done
          rss() { ps aux | grep next-server | grep -v grep | awk '{s+=$6} END {print int(s/1024)"MB"}'; }
          out="node $(node -v) start $(rss)"
          for p in / /tier /duo /aram /champions/Jinx "/tier?s=na1" "/tier?s=euw1" "/champions/Ahri?s=euw1" /meta /trends /aram/Jinx /tier/opengraph-image /; do
            r=$(curl -s -o /dev/null -m 60 -w '%{http_code} %{time_total}s' "http://localhost:3999$p")
            out="$out | $p $r $(rss)"
          done
          echo "::notice title=memory::$out"
          echo "::notice title=log::$(grep -iE 'error|memory|killed|⨯' server.log | head -5 | tr '\n' ' ' | cut -c1-900)"
