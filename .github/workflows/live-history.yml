# 서버별 "지금 게임 중인 마스터+ 랭커 수"를 10분마다 기록해서 live-data 브랜치에 올립니다.
# GitHub 예약 실행은 몇 시간씩 밀릴 때가 많아서, 한 번 시작하면 약 5시간 40분 동안 10분 간격으로 직접 반복하고
# 끝나기 직전에 자기 자신을 다시 실행해 계속 이어갑니다. (예약 실행은 끊겼을 때 다시 살리는 용도)
# 사이트 첫 페이지의 실시간 인원 그래프(최근 24시간)가 이 기록을 읽어요.
name: 실시간 인원 기록

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live-history
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 10분마다 인원 재고 올리기
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          OUT: /tmp/live-data
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p $OUT
          git fetch --depth=1 origin live-data 2>/dev/null && for s in kr na1 euw1; do
            git show origin/live-data:$s.json > $OUT/$s.json 2>/dev/null || rm -f $OUT/$s.json
          done
          # 이 브랜치는 데이터만 담아서 Vercel 이 배포하지 않게 (안 그러면 하루 배포 한도를 다 써요)
          ( cd $OUT && echo '{"git":{"deploymentEnabled":false}}' > vercel.json )
          start=$(date +%s)
          while [ $(( $(date +%s) - start )) -lt $((335 * 60)) ]; do
            t0=$(date +%s)
            code=0; node scripts/live-sample.mjs || code=$?
            ( cd $OUT && ls *.json >/dev/null 2>&1 && rm -rf .git && git init -q -b live-data \
              && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add *.json \
              && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "실시간 인원 기록" \
              && git push -q --force "https://x-access-token:$TOKEN@github.com/$REPO.git" live-data ) || echo "::warning::올리기 실패"
            sleep $(( 600 - ( $(date +%s) - t0 ) > 0 ? 600 - ( $(date +%s) - t0 ) : 1 ))
            # 시크릿은 실행이 시작될 때 한 번만 들어오니, 키가 거절되면 이번 실행을 끝내고 새 실행에서 새 키를 받는다
            [ "$code" = 3 ] && break
          done
      - name: 다음 회차 이어서 실행
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-history.yml -R ${{ github.repository }} --ref main
