name: 페이지 점검
# 사이트 주요 페이지와 공유 이미지가 실제로 열리는지 확인만 합니다 (시크릿 없음).
# 결과는 알림(notice)으로 남겨요. 단계당 알림이 10개까지라 한 줄에 여러 개를 묶어요.
on:
  workflow_dispatch:
    inputs:
      site:
        description: 점검할 사이트 주소
        default: https://livelol.onrender.com
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Burst (several visitors at once, 6 requests in flight)
        # 한꺼번에 40개 넘게 열면 무료 서버(512MB)가 점검 때문에 넘어져서, 동시에 6개까지만 열어요
        run: |
          SITE=${{ inputs.site || 'https://livelol.onrender.com' }}
          curl -s --max-time 90 -o /dev/null -m 120 "$SITE/"
          for s in kr na1 euw1; do
            for p in / /tier "/tier?rank=master" "/tier?rank=diamond" /duo /aram /champions/Jinx "/champions/Ahri?rank=master" /items /matchup /meta /trends /ranking /pros /bans; do
              echo "$s $p"
            done
          done | xargs -P 6 -L 1 sh -c 'curl -s --max-time 90 -o /dev/null -b "server=$0" -w "%{http_code}\n" "'"$SITE"'$1"' > codes.txt
          echo "::notice title=burst::$(sort codes.txt | uniq -c | tr '\n' ' ')"
      - name: Fetch pages
        run: |
          SITE=${{ inputs.site || 'https://livelol.onrender.com' }}
          pages=""
          # 502일 때 누가 막는지(Render 안내 페이지인지) 제목과 헤더 몇 줄을 남겨요
          curl -s --max-time 90 -D h.txt -o b.html "$SITE/tier"
          echo "::notice title=tier response::$(head -1 h.txt) $(grep -i '^x-render\|^server\|^rndr' h.txt | tr '\r\n' '  ') title=$(grep -o '<title>[^<]*' b.html | head -1)"
          for p in / /tier /duo /aram "/aram/Jinx?mode=aram" /champions/Jinx "/summoner?id=Hide%20on%20bush%23KR1&s=kr" "/multi?s=kr&q=Hide%20on%20bush%20%23KR1"; do
            pages="$pages | $p $(curl -s --max-time 90 -o /dev/null -w '%{http_code}' "$SITE$p")"
          done
          echo "::notice title=pages::${pages//%/pct}"
          imgs=""
          for p in /tier/opengraph-image /duo/opengraph-image /bans/opengraph-image /multi/opengraph-image /champions/Jinx/opengraph-image "/api/aram-card?id=Jinx&mode=aram" "/api/card?id=Hide%20on%20bush%23KR1&s=kr"; do
            imgs="$imgs | $p $(curl -s --max-time 90 -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$SITE$p")"
          done
          echo "::notice title=share images::${imgs//%/pct}"
          comm=$(curl -s --max-time 90 "$SITE/community" | grep -o 'community is unavailable\|커뮤니티를 지금 쓸 수 없' | head -1)
          echo "::notice title=community::${comm:-ok}"
          pros=""
          for c in Riven Jinx Ahri LeeSin; do
            curl -s --max-time 90 -D ph.txt -b lang=en "$SITE/champions/$c" -o pc.html
            hit=$(grep -c 'builds from pros and challengers' pc.html)
            pros="$pros | $c panel=$hit cache=$(grep -i '^x-page-cache' ph.txt | tr -d '\r' | cut -d' ' -f2)"
          done
          echo "::notice title=champion pro builds::$pros"
          case "$pros" in *"panel=0"*) echo "::warning title=champion pro builds::panel missing on some champion pages";; esac
          # 지금 게임 중인 프로 한 명을 찾아 소환사 페이지의 인게임 칸을 확인해요
          who=""; srv=""
          for i in 1 2 3 4 5 6; do
            j=$(curl -s --max-time 90 "$SITE/api/pros-live")
            who=$(echo "$j" | jq -r '.live[0].who // empty'); srv=$(echo "$j" | jq -r '.live[0].server // empty')
            [ -n "$who" ] && break; sleep 20
          done
          if [ -n "$who" ]; then
            enc=$(jq -rn --arg v "$who" '$v|@uri')
            html=$(curl -s --max-time 90 "$SITE/summoner?id=$enc&s=$srv")
            flag=$(echo "$html" | grep -o 'In game now\|지금 게임 중' | head -1)
            lp=$(echo "$html" | grep -o '[A-Z][A-Z1-4]* [0-9]*LP' | head -10 | tr '\n' ',')
            err=$(echo "$html" | grep -o 'role="alert"[^<]*<' | head -1)
            ach=$(echo "$html" | grep -o 'My achievements\|내 업적' | head -1)
            card=$(curl -s --max-time 90 -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$SITE/api/card?id=$enc&s=$srv")
            echo "::notice title=summoner live game::${who//%/pct} ($srv): ${flag:-panel missing} / ranks: ${lp:-none} / achievements: ${ach:-missing} / share card: ${card} / error: ${err:-none} / bytes: ${#html}"
          else
            echo "::notice title=summoner live game::no live pro found to test. pros-live said: $(echo "$j" | jq -c '{available,reason,total,checked,live:(.live|length),lastStatus}')"
          fi
      - name: Multi-search
        run: |
          SITE=${{ inputs.site || 'https://livelol.onrender.com' }}
          Q='Hide%20on%20bush%20%23KR1%EB%8B%98%EC%9D%B4%20%EB%A1%9C%EB%B9%84%EC%97%90%20%EC%B0%B8%EA%B0%80%ED%95%98%EC%85%A8%EC%8A%B5%EB%8B%88%EB%8B%A4.%0AT1%20Gumayusi%20%23KR1'
          t=$(curl -s --max-time 90 -b lang=en "$SITE/multi?s=kr&q=$Q" -o m.html -w "%{http_code} %{time_total}s" || echo "timeout")
          cards=$(grep -o 'block truncate font-bold">[^<]*' m.html | sed 's/.*">//' | tr '\n' ',')
          errs=$(grep -oE "(Summoner not found|Too many lookups|Riot lookups are unavailable|Couldn.t load)[^<]*" m.html | sort | uniq -c | tr '\n' ' ')
          recent=$(grep -oE '[0-9]+W [0-9]+L' m.html | head -4 | tr '\n' ' ')
          bans=$(grep -c "Bans for your team" m.html || true); echo "::notice title=multi-search::$t cards=$cards records=$recent bansPanel=$bans errors=${errs:-none}"
