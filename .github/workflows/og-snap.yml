name: 공유 이미지 받아 보기
# 실사이트 공유 이미지를 받아 아티팩트로 남겨요 (눈으로 확인용, 시크릿 없음)
on:
  workflow_dispatch:
    inputs:
      paths:
        description: 쉼표로 구분한 이미지 경로
        default: /champions/Ahri/opengraph-image,/api/aram-card?id=Jinx&mode=aram
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; i=0
          IFS=',' read -ra P <<< "${{ inputs.paths }}"
          for p in "${P[@]}"; do
            i=$((i+1))
            r=$(curl -s --max-time 90 -o "out/$i.png" -w '%{http_code} %{size_download}' "https://livelol.onrender.com$p")
            echo "::notice title=$p::$r"
          done
      - name: Push to og-snap branch (아티팩트는 컨테이너에서 못 받아서 브랜치로 남겨요)
        run: |
          cd out
          git init -q -b og-snap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "공유 이미지 $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" og-snap
