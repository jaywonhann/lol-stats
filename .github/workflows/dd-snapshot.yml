name: Data Dragon 사본 (점검용)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://ddragon.leagueoflegends.com
          mkdir -p dd/api && curl -sf $B/api/versions.json -o dd/api/versions.json
          V=$(jq -r '.[0]' dd/api/versions.json)
          for l in en_US ko_KR; do
            mkdir -p dd/cdn/$V/data/$l/champion
            for f in champion item runesReforged summoner; do curl -sf $B/cdn/$V/data/$l/$f.json -o dd/cdn/$V/data/$l/$f.json; done
            for c in Jinx Ahri; do curl -sf $B/cdn/$V/data/$l/champion/$c.json -o dd/cdn/$V/data/$l/champion/$c.json; done
          done
          cd dd && git init -q -b dd-tmp && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm dd
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dd-tmp
