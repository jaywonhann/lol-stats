# 실제 사이트 스크린샷을 찍어 screenshots 브랜치에 올립니다 (main 배포에는 영향 없음).
name: 사이트 스크린샷

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 브라우저 준비
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: 찍기
        run: |
          mkdir -p shots && cp scripts/screenshots.mjs /tmp/pw/
          cd /tmp/pw
          OUT=$GITHUB_WORKSPACE/shots SHOT_LANG=ko node screenshots.mjs
          OUT=$GITHUB_WORKSPACE/shots SHOT_LANG=en node screenshots.mjs
      - name: screenshots 브랜치에 올리기
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "사이트 스크린샷 $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
