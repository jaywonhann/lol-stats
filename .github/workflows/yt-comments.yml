# 롤 유튜브 영상의 공개 댓글을 모아 분석용 아티팩트로 올려요 (수동 실행)
name: yt-comments
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "space-separated video ids"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: pip install -q yt-dlp
      - run: |
          mkdir out
          for id in ${{ inputs.ids }}; do
            yt-dlp --skip-download --write-comments --no-warnings \
              --extractor-args "youtube:max_comments=300,300,0,0;comment_sort=top" \
              -o "out/$id.%(ext)s" "https://www.youtube.com/watch?v=$id" >> log.txt 2>&1 || echo "failed $id" >> log.txt
          done
          python3 - <<'PY'
          import json, glob
          rows = []
          for f in glob.glob("out/*.info.json"):
              d = json.load(open(f))
              for c in d.get("comments") or []:
                  rows.append({"video": d.get("id"), "title": d.get("title"), "channel": d.get("channel"), "text": c.get("text"), "likes": c.get("like_count") or 0})
          json.dump(rows, open("comments.json", "w"), ensure_ascii=False)
          print(len(rows), "comments")
          PY
      # 아티팩트는 컨테이너에서 못 받아서 research 브랜치(배포 꺼짐)에 올려요
      - run: |
          mkdir pub && cd pub && git init -q -b research
          cp ../comments.json ../log.txt . && echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qam research 2>/dev/null || { git add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm research; }
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" research
