# 방문자 세기 신호(/__hit)가 실제 브라우저에서 나가는지 확인합니다.
# 신호는 서버로 보내지 않고 가로채서(204로 응답) 숫자에 섞이지 않아요.
name: 방문자 신호 점검

on:
  workflow_dispatch:
    inputs:
      extra:
        description: "더 볼 주소 (쉼표로 구분)"
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 브라우저 준비
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: 페이지 열고 스크롤해 보기
        run: |
          cd /tmp/pw
          cat > hit.mjs <<'JS'
          import { chromium } from "playwright";
          const base = "https://livelol.onrender.com";
          const extra = (process.env.EXTRA || "").split(",").filter(Boolean);
          const pages = ["/", "/tier", "/summoner?id=Hide%20on%20bush%23KR1&s=kr", "/champions/Yasuo/counters", ...extra];
          const browser = await chromium.launch();
          let bad = 0;
          for (const p of pages) {
            const ctx = await browser.newContext({ userAgent: "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1" });
            const page = await ctx.newPage();
            const hits = [], errors = [];
            await page.route("**/__hit*", (r) => { hits.push(r.request().url()); r.fulfill({ status: 204 }); });
            const res = [];
            page.on("requestfinished", async (r) => { const tm = r.timing(); res.push([Math.round(tm.responseEnd > 0 ? tm.startTime + tm.responseEnd - t0 : Date.now() - t0), r.resourceType(), r.url().replace(base, "").slice(0, 70)]); });
            page.on("requestfailed", (r) => res.push([Date.now() - t0, "FAILED", r.url().replace(base, "").slice(0, 70)]));
            let t0 = Date.now(), dcl = 0;
            page.on("domcontentloaded", () => (dcl = Date.now() - t0));
            page.on("pageerror", (e) => errors.push(String(e.message).slice(0, 160)));
            page.on("console", (m) => { if (m.type() === "error") errors.push("console: " + m.text().slice(0, 160)); });
            const t = Date.now(); t0 = t;
            try {
              await page.goto(base + p, { waitUntil: "load", timeout: 90000 });
              await page.waitForTimeout(2500);
              await page.mouse.move(100, 200); await page.mouse.wheel(0, 600);
              await page.waitForTimeout(2500);
            } catch (e) { errors.push("goto: " + e.message.slice(0, 120)); }
            const msg = `${p}: hits=${hits.length} load=${Date.now() - t}ms dcl=${dcl}ms slowest=${res.sort((a, b) => b[0] - a[0]).slice(0, 4).map((x) => x.join(" ")).join(" ; ")} errors=${errors.length}${errors.length ? " | " + errors.slice(0, 3).join(" | ") : ""}`;
            if (!hits.length) { bad++; console.log(`::warning::${msg}`); } else console.log(`::notice::${msg}`);
            await ctx.close();
          }
          await browser.close();
          process.exit(bad ? 1 : 0);
          JS
          EXTRA="${{ inputs.extra }}" node hit.mjs
