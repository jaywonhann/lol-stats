name: 랭크 게임 수집

on:
  schedule:
    - cron: "0 3,9,15,21 * * *" # 한국 시간 0시·6시·12시·18시 (6시간마다)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        server: [kr, na1, euw1] # 한국, 북미, 유럽 서부 (API 사용량 제한이 서버별로 따로라 동시에 돌려도 됩니다)
    concurrency:
      group: collect-${{ matrix.server }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 대기하다 시작한 작업도 앞 작업이 올린 최신 데이터에서 이어가도록
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 게임 수집
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          SERVER: ${{ matrix.server }}
          MAX_MINUTES: "55"
        run: node scripts/collect.mjs
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "랭크 게임 데이터 업데이트 (${{ matrix.server }})"
          # 다른 서버 작업이 먼저 올렸으면 받아서 다시 올립니다 (서버마다 다른 폴더라 충돌 없음)
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
