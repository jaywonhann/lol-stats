name: 랭크 게임 수집

on:
  schedule:
    - cron: "0 15 * * *" # 매일 한국 시간 자정
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 게임 수집
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          MAX_MINUTES: "55"
        run: node scripts/collect.mjs
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "랭크 게임 데이터 업데이트"
          git push
