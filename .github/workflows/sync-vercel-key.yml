# GitHub 시크릿 RIOT_API_KEY (와 있으면 FEEDBACK_TOKEN) 을 Vercel 환경변수로 복사하고, 바뀌었으면 다시 배포합니다.
# 필요한 시크릿: VERCEL_TOKEN (vercel.com/account/tokens 에서 발급, 한 번만 넣으면 됨)
# 30분마다 확인하고, Actions 탭에서 직접 실행할 수도 있어요.
name: Vercel 키 동기화

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "키가 같아도 다시 넣고 재배포"
        type: boolean
        default: false
      diagnose:
        description: "실제 사이트가 어느 배포를 가리키는지 확인만"
        type: boolean
        default: false

concurrency:
  group: sync-vercel-key

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 키 복사하고 재배포
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          PROJECT: lol-stats
          FORCE: ${{ inputs.force }}
          DIAGNOSE: ${{ inputs.diagnose }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::warning::VERCEL_TOKEN 시크릿이 없어서 건너뜁니다."
            exit 0
          fi
          KEY=$(printf '%s' "$RIOT_API_KEY" | grep -oiE 'RGAPI-[0-9a-f-]{36}' | head -1 || true)
          [ -n "$KEY" ] || KEY=$(printf '%s' "$RIOT_API_KEY" | tr -d '[:space:]')
          [ -n "$KEY" ] || { echo "::error::RIOT_API_KEY 시크릿이 비어 있어요."; exit 1; }
          API=https://api.vercel.com
          AUTH="Authorization: Bearer $VERCEL_TOKEN"

          # 개인 계정이면 그대로, 팀(Hobby 포함) 계정이면 teamId 를 붙여서 프로젝트를 찾는다
          Q=""
          proj=$(curl -fsS -H "$AUTH" "$API/v9/projects/$PROJECT" || true)
          if [ -z "$proj" ]; then
            for t in $(curl -fsS -H "$AUTH" "$API/v2/teams" | jq -r '.teams[].id'); do
              proj=$(curl -fsS -H "$AUTH" "$API/v9/projects/$PROJECT?teamId=$t" || true)
              if [ -n "$proj" ]; then Q="?teamId=$t"; break; fi
            done
          fi
          [ -n "$proj" ] || { echo "::error::Vercel 에서 $PROJECT 프로젝트를 못 찾았어요. 토큰 범위를 확인해 주세요."; exit 1; }
          S=${Q:+&${Q#?}}
          echo "::notice::프로젝트 찾음 (${Q:-개인 계정})"
          if [ "${DIAGNOSE:-false}" = true ]; then
            live=$(curl -fsS -H "$AUTH" "$API/v13/deployments/lol-stats-one.vercel.app$Q" || true)
            echo "::notice::사이트 배포: $(echo "$live" | jq -r '"\(.id) \(.readyState) \(.target) \(.meta.githubCommitSha // "-" | .[0:7]) " + ((.createdAt // 0) / 1000 | todate)')"
            curl -fsS -H "$AUTH" "$API/v6/deployments?projectId=$(echo "$proj" | jq -r .id)&limit=5$S" \
              | jq -r '.deployments[] | "::notice::최근 배포: \(.uid) \(.state) \(.target // "preview") \(.meta.githubCommitSha // "-" | .[0:7]) " + (.created / 1000 | todate)'
            curl -fsS -H "$AUTH" "$API/v9/projects/$PROJECT/env$Q" \
              | jq -r '.envs[] | "::notice::환경변수: \(.key) \(.type) \(.target | join(","))"'
            r=$(curl -sS -D - "https://lol-stats-one.vercel.app/api/live?server=kr&n=$RANDOM" | tr -d '\r')
            echo "::notice::사이트 응답: $(echo "$r" | grep -iE '^(x-vercel-cache|x-vercel-id|cache-control|age):' | tr '\n' ' ') $(echo "$r" | tail -1 | cut -c1-120)"
            kid=$(curl -fsS -H "$AUTH" "$API/v9/projects/$PROJECT/env$Q" | jq -r '.envs[] | select(.key=="RIOT_API_KEY") | .id' | head -1)
            echo "::notice::저장된 키 길이: $(curl -fsS -H "$AUTH" "$API/v1/projects/$PROJECT/env/$kid$Q" | jq -r '(.value // "") | length') / 시크릿 키 길이: ${#KEY}"
            echo "$proj" | jq -r '"::notice::롤백 상태: " + ((.rollbackDescription // .lastRollbackTarget // "없음") | tostring)'
            exit 0
          fi

          # 값의 해시(앞 16자)를 NAME_SHA 로 같이 저장해 두고, 같으면 건드리지 않는다. 값 자체는 읽지 않는다.
          envs=$(curl -fsS -H "$AUTH" "$API/v9/projects/$PROJECT/env$Q")
          sync_var() {
            local name=$1 val=$2 sha cur has
            sha=$(printf '%s' "$val" | sha256sum | cut -c1-16)
            cur=$(echo "$envs" | jq -r --arg k "${name}_SHA" '.envs[] | select(.key==$k) | .value' | head -1)
            has=$(echo "$envs" | jq -r --arg k "$name" '[.envs[] | select(.key==$k)] | length')
            if [ "$cur" = "$sha" ] && [ "$has" != 0 ] && [ "${FORCE:-false}" != true ]; then
              echo "::notice::$name 은 이미 최신이에요."
              return 0
            fi
            echo "$envs" | jq -r --arg a "$name" --arg b "${name}_SHA" '.envs[] | select(.key==$a or .key==$b) | .id' \
              | while read -r old; do
                  curl -fsS -X DELETE -H "$AUTH" "$API/v9/projects/$PROJECT/env/$old$Q" > /dev/null
                done
            jq -n --arg k "$name" --arg v "$val" '{key:$k, value:$v, type:"encrypted", target:["production","preview","development"]}' \
              | curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/v10/projects/$PROJECT/env$Q" -d @- > /dev/null
            jq -n --arg k "${name}_SHA" --arg v "$sha" '{key:$k, value:$v, type:"plain", target:["production","preview","development"]}' \
              | curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/v10/projects/$PROJECT/env$Q" -d @- > /dev/null
            echo "::notice::Vercel 에 $name 을 새로 넣었어요."
            changed=1
          }
          changed=0
          sync_var RIOT_API_KEY "$KEY"
          FT=$(printf '%s' "${FEEDBACK_TOKEN:-}" | tr -d '[:space:]')
          if [ -n "$FT" ]; then sync_var FEEDBACK_TOKEN "$FT"; fi
          [ "$changed" = 1 ] || exit 0

          # 최신 프로덕션 배포를 다시 배포해서 새 키 적용
          dep=$(curl -fsS -H "$AUTH" "$API/v6/deployments?projectId=$(echo "$proj" | jq -r .id)&target=production&state=READY&limit=1$S" \
            | jq -r '.deployments[0].uid')
          jq -n --arg d "$dep" --arg n "$PROJECT" '{name:$n, deploymentId:$d, target:"production"}' \
            | curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                "$API/v13/deployments$Q" -d @- \
            | jq -r '"::notice::재배포 시작: " + (.url // "?") + " (" + (.readyState // .status // "?") + ")"'
