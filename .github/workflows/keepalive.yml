name: 사이트 깨워 두기
# Render 무료 서버는 15분 동안 아무도 안 들어오면 잠들어서, 다음 첫 접속이 1분쯤 걸려요.
# 10분마다 한 번씩 가볍게 들어가서 깨워 둡니다. (GitHub 예약 실행은 자주 밀려서 한 번에 5시간 50분 동안 돌고 다시 자기를 실행해요)
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */2 * * *"
concurrency:
  group: keepalive
  cancel-in-progress: false
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - run: |
          start=$(date +%s)
          while [ $(( $(date +%s) - start )) -lt $((350 * 60)) ]; do
            code=$(curl -s -o /dev/null -m 90 -w '%{http_code}' https://livelol.onrender.com/robots.txt || true)
            # 홈의 "예시로 보기" 버튼이 여는 전적 페이지도 같이 열어서, 사람이 눌렀을 때 저장된 결과가 바로 나오게 해요
            # (전적 캐시는 10분이라 9분마다 열면 계속 따뜻해요. 배포로 캐시가 비워진 뒤에도 다음 핑에서 다시 채워져요)
            ex=$(curl -s -o /dev/null -m 60 -w '%{http_code} %{time_total}s' "https://livelol.onrender.com/summoner?id=Hide%20on%20bush%23KR1&s=kr" || true)
            echo "$(date -u +%H:%M) $code example:$ex"
            sleep 540
          done
      - if: always()
        run: gh workflow run keepalive.yml -R ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ github.token }}
