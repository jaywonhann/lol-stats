# Render 무료 웹 서비스 설정 (Vercel 대신). Render 대시보드에서 New > Blueprint 로 이 저장소를 고르면 됩니다.
services:
  - type: web
    name: livelol
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      - key: RIOT_API_KEY
        sync: false
      - key: FEEDBACK_TOKEN
        sync: false
