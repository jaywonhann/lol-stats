# Render 무료 웹 서비스 설정 (Vercel 대신). Render 대시보드에서 New > Blueprint 로 이 저장소를 고르면 됩니다.
services:
  - type: web
    name: livelol
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # 수집 데이터만 바뀐 푸시로는 배포하지 않아요 (무료 빌드 시간이 한 달 500분이라서).
    # 데이터는 render-deploy.yml 이 하루 두 번 배포 훅으로 반영합니다.
    buildFilter:
      ignoredPaths:
        - data/**
        - promo/**
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: RIOT_API_KEY
        sync: false
      - key: FEEDBACK_TOKEN
        sync: false
