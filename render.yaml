# Render 무료 웹 서비스 설정 (Vercel 대신). Render 대시보드에서 New > Blueprint 로 이 저장소를 고르면 됩니다.
services:
  - type: web
    name: livelol
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && NODE_OPTIONS=--max-old-space-size=350 npm run build
    # 힙 한도: 200MB에선 이미지·소환사 페이지를 만들 때 힙이 180MB대까지 차서 넘쳤어요 (x-mem 기록, 그때 RSS는 430MB)
    startCommand: NODE_OPTIONS=--max-old-space-size=220 node server.mjs
    # 수집 데이터만 바뀐 푸시로는 배포하지 않아요 (무료 빌드 시간이 한 달 500분이라서).
    # 데이터는 render-deploy.yml 이 하루 두 번 배포 훅으로 반영합니다.
    buildFilter:
      ignoredPaths:
        - data/**
        - promo/**
        - .github/**
        - scripts/aram.mjs
        - scripts/browser-check.mjs
        - scripts/screenshots.mjs
        - scripts/collect.mjs
        - scripts/live-sample.mjs
        - scripts/pro-builds.mjs
        - scripts/rate.mjs
        - scripts/screenshots.mjs
        - scripts/visits.mjs
    healthCheckPath: /robots.txt
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: RIOT_API_KEY
        sync: false
      - key: FEEDBACK_TOKEN
        sync: false
